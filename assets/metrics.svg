    <text x="210" y="98" text-anchor="middle" class="kn">26</text>
    <text x="210" y="118" text-anchor="middle" class="kl">MICHIS</text></g><g class="kp" style="animation-delay:0.50s"><rect x="280" y="54" width="116" height="78" rx="12" fill="#fffdf9" stroke="#e8dfd6"/>
    <text x="338" y="98" text-anchor="middle" class="kn">3</text>
