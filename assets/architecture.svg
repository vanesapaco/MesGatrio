<svg xmlns="http://www.w3.org/2000/svg" width="420" height="340" viewBox="0 0 420 340" role="img" aria-label="Arquitectura de la página">
  <title>Page architecture · Mes Gatrio</title>
  <style>
    text { font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif; }
    .lbl { fill:#b31b2c; font-size:12px; font-weight:700; letter-spacing:2.5px; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace; }
    .spk { fill:#b31b2c; animation:tw 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    @keyframes tw { 0%,100% { opacity:.35; transform:scale(.6) rotate(0deg); } 50% { opacity:1; transform:scale(1) rotate(45deg); } }

    .nd { opacity:0; animation:in .5s ease-out forwards; }
    .nt { fill:#2b1a1c; font-size:14px; font-weight:700; } .nt0 { fill:#fffdf9; font-size:14px; font-weight:700; }
    .ns { fill:#8a7b78; font-size:11.5px; font-weight:600; } .ns0 { fill:#f3d9c9; font-size:11.5px; font-weight:600; }
    .ln { animation:dash 1.5s linear infinite; }
    @keyframes dash { to { stroke-dashoffset:-14; } }
    @keyframes in { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  </style>
  <rect width="420" height="340" rx="18" fill="#f6f3ee"/>
  <rect x="1" y="1" width="418" height="338" rx="17" fill="none" stroke="#e8dfd6" stroke-width="1.5"/>
  <text x="24" y="34" class="lbl">PAGE.ARCHITECTURE</text>
  <path class="spk" d="M392,23 Q392,30 399,30 Q392,30 392,37 Q392,30 385,30 Q392,30 392,23 Z" style="animation-delay:0.0s"/>
  <path d="M40,108 V293" fill="none" stroke="#b31b2c" stroke-width="2" stroke-dasharray="3 4" class="ln"/>
  <g class="nd" style="animation-delay:0.25s">
    <rect x="24" y="58" width="348" height="50" rx="10" fill="#b31b2c" stroke="#b31b2c"/>
    <text x="40" y="79" class="mono nt0">index.html</text>
    <text x="40" y="97" class="ns0">una sola página · GitHub Pages</text>
  </g><g class="nd" style="animation-delay:0.45s">
    <rect x="64" y="128" width="308" height="50" rx="10" fill="#fffdf9" stroke="#e8dfd6"/>
    <text x="80" y="149" class="mono nt">Popups promo</text>
    <text x="80" y="167" class="ns">categorías · genera · vota</text>
  </g><path d="M40,153 H64" fill="none" stroke="#b31b2c" stroke-width="2" stroke-dasharray="3 4" class="ln"/><g class="nd" style="animation-delay:0.65s">
    <rect x="64" y="198" width="308" height="50" rx="10" fill="#fffdf9" stroke="#e8dfd6"/>
    <text x="80" y="219" class="mono nt">Generador</text>
    <text x="80" y="237" class="ns">foto + emote → GIF (canvas)</text>
  </g><path d="M40,223 H64" fill="none" stroke="#b31b2c" stroke-width="2" stroke-dasharray="3 4" class="ln"/><g class="nd" style="animation-delay:0.85s">
    <rect x="64" y="268" width="308" height="50" rx="10" fill="#fffdf9" stroke="#e8dfd6"/>
    <text x="80" y="289" class="mono nt">Ranking</text>
    <text x="80" y="307" class="ns">podio + tabla completa</text>
  </g><path d="M40,293 H64" fill="none" stroke="#b31b2c" stroke-width="2" stroke-dasharray="3 4" class="ln"/>
</svg>