<svg xmlns="http://www.w3.org/2000/svg" width="420" height="340" viewBox="0 0 420 340" role="img" aria-label="Seguimiento de métricas del Mes Gatrio">
  <title>Metrics · Mes Gatrio</title>
  <style>
    text { font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif; }
    .lbl { fill:#b31b2c; font-size:12px; font-weight:700; letter-spacing:2.5px; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace; }
    .spk { fill:#b31b2c; animation:tw 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    @keyframes tw { 0%,100% { opacity:.35; transform:scale(.6) rotate(0deg); } 50% { opacity:1; transform:scale(1) rotate(45deg); } }

    .kp { opacity:0; animation:up .5s ease-out forwards; }
    .kn { fill:#b31b2c; font-size:30px; font-weight:800; letter-spacing:-1px; }
    .kl { fill:#8a7b78; font-size:9.5px; font-weight:700; letter-spacing:1.8px; }
    .bc { fill:#2b1a1c; font-size:13px; font-weight:700; }
    .bv { fill:#8a7b78; font-size:11.5px; font-weight:600; }
    .bar { transform-box:fill-box; transform-origin:left; transform:scaleX(0); animation:grow 1.2s cubic-bezier(.3,.9,.3,1) forwards; }
    @keyframes grow { to { transform:scaleX(1); } }
    @keyframes up { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  </style>
  <rect width="420" height="340" rx="18" fill="#f6f3ee"/>
  <rect x="1" y="1" width="418" height="338" rx="17" fill="none" stroke="#e8dfd6" stroke-width="1.5"/>
