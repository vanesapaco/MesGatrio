    .typing { animation:type 1.6s steps(40) .3s both; }
    .ring2 { fill:none; stroke:#b31b2c; stroke-width:2; stroke-dasharray:4 8; animation:spin 24s linear infinite; transform-origin:830px 150px; }
    .orb { animation:spin 9s linear infinite; transform-origin:830px 150px; }
    .eo { animation:bA 4s steps(1) infinite; } .es { opacity:0; animation:bB 4s steps(1) infinite; }
    @keyframes bA { 0%,88% { opacity:1; } 90%,94% { opacity:0; } 96%,100% { opacity:1; } }
    @keyframes bB { 0%,88% { opacity:0; } 90%,94% { opacity:1; } 96%,100% { opacity:0; } }
    @keyframes up { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes type { from { clip-path:inset(0 100% 0 0); } to { clip-path:inset(0 0 0 0); } }
