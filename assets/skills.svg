    .ss { fill:#8a7b78; font-size:11.5px; font-weight:600; }
    .ok { fill:#b31b2c; font-size:9.5px; font-weight:800; letter-spacing:1.5px; }
    @keyframes in { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:none; } }
  </style>
